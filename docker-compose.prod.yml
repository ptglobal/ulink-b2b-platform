# ULink — production overlay for the shared PUBLIC host (gitlab.pathtech.net / 103.164.35.132).
#
# The base docker-compose.yml publishes Postgres/Redis/Mailpit/Swagger to 0.0.0.0 and
# bind-mounts extension source over the image — fine on a laptop, wrong on a public
# server. This overlay uses Compose's `!override` tag (Compose v2.24+) to REPLACE — not
# append — ports and volumes so that:
#   - infrastructure stays on loopback; only Directus :8055 is internet-reachable;
#   - Directus runs extensions straight from the self-contained image (no src mounts
#     shadowing the baked dist/ + node_modules).
#
# Deploy:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  postgres:
    ports: !override
      - '127.0.0.1:5432:5432' # loopback only (Directus reaches it via the compose network)

  redis:
    ports: !override
      - '127.0.0.1:6379:6379' # loopback only

  mailpit:
    ports: !override
      - '127.0.0.1:1025:1025' # SMTP — loopback only
      - '127.0.0.1:8025:8025' # web UI — reach via SSH tunnel

  swagger-ui:
    ports: !override
      - '127.0.0.1:8056:8080' # API docs — reach via SSH tunnel

  directus:
    ports: !override
      - '8055:8055' # PUBLIC — the chosen direct-port exposure
    # Drop the dev src/ bind-mounts (they shadow the image's baked extensions on a
    # fresh clone). Keep only uploads (named volume, container-owned uid 1000, no host
    # chown needed) and the shared lib/ that extensions import via ../../../lib.
    volumes: !override
      - ulink_uploads:/directus/uploads
      - ./directus/lib:/directus/lib

volumes:
  ulink_uploads: # Directus uploads — container-owned (uid 1000), survives recreates
