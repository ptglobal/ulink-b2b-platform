name: ulink

# ULink B2B Platform — backend stack (Directus + PostgreSQL + Redis)
# Frontend (Next.js) runs separately (Vercel in prod, `npm run dev` locally).
# Copy .env.example -> .env and edit secrets before `docker compose up -d`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose only if you need direct DB access from the host:
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    # Exposed so the local frontend /api/sku route can use the cache in dev:
    ports:
      - '6379:6379'

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      ACCESS_TOKEN_TTL: '1d'

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      REDIS: redis://redis:6379

      WEBSOCKETS_ENABLED: 'true'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'true'

      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads

      FILES_MAX_UPLOAD_SIZE: 10mb
      FILES_MIME_TYPE_ALLOW_LIST: image/jpeg,image/png,image/webp,image/svg+xml,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SECURE: 'false'
      MAIL_USER: ''
      MAIL_PASSWORD: ''
      MAIL_FROM: 'ULINK <no-reply@ulink.com>'
      PASSWORD_RESET_URL_ALLOW_LIST: ${PASSWORD_RESET_URL_ALLOW_LIST:-http://localhost:3000/reset-password}

      EMAIL_TRANSPORT: smtp
      EMAIL_FROM: no-reply@ulink.com
      EMAIL_SMTP_HOST: ${MAIL_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${MAIL_PORT:-1025}
      EMAIL_SMTP_SECURE: ${MAIL_SECURE:-false}
      EMAIL_SMTP_USER: ${MAIL_USER:-}
      EMAIL_SMTP_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - ./directus/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
      - ./directus/lib:/directus/lib
      - ./directus/constants.mjs:/directus/constants.mjs
    ports:
      - '8055:8055'

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_started
    environment:
      SWAGGER_JSON: /app/open.json
    volumes:
      - ./open.json:/app/open.json:ro
    ports:
      - '8056:8080'

volumes:
  pgdata:
  redisdata:
