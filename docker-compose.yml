name: ulink

# ULink B2B Platform — backend stack (Directus + PostgreSQL + Redis)
# Frontend (Next.js) runs separately (Vercel in prod, `npm run dev` locally).
# Copy .env.example -> .env and edit secrets before `docker compose up -d`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose only if you need direct DB access from the host:
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    # Exposed so the local frontend /api/sku route can use the cache in dev:
    ports:
      - '6379:6379'

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  directus:
    build:
      context: ./directus
      dockerfile: Dockerfile
    image: ulink/directus:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      ACCESS_TOKEN_TTL: '15m'

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      REDIS: redis://redis:6379
      # Expose Redis to custom endpoint extensions (e.g. otp-endpoint).
      REDIS_URL: redis://redis:6379

      # --- OTP (otp-endpoint) ---
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      ALLOW_DEBUG_OTP: ${ALLOW_DEBUG_OTP:-false}

      # --- Verified-token & password-change rate-limit ---
      # verified_token TTL (15 min) aligns with the Directus reset-link window
      # so a user who verifies their email and then follows a reset link has
      # the same expiry budget.
      VERIFIED_TOKEN_TTL_SECONDS: "900"
      PASSWORD_CHANGE_FAIL_MAX: "3"
      PASSWORD_CHANGE_FAIL_WINDOW: "900"

      MAIL_FROM: ${MAIL_FROM:-ULINK <no-reply@ulink.com>}

      WEBSOCKETS_ENABLED: 'true'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'true'

      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads

      FILES_MAX_UPLOAD_SIZE: 10mb
      FILES_MIME_TYPE_ALLOW_LIST: image/jpeg,image/png,image/webp,image/svg+xml,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SECURE: 'false'
      MAIL_USER: ''
      MAIL_PASSWORD: ''
      PASSWORD_RESET_URL_ALLOW_LIST: ${PASSWORD_RESET_URL_ALLOW_LIST:-http://localhost:3000/reset-password,http://192.168.1.36:3000/reset-password}
      PASSWORD_RESET_TOKEN_TTL: '15m'
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://192.168.1.36:3000}
      REFRESH_TOKEN_AUTO_REUSE: 'false'
      RATE_LIMITER_ENABLED: 'false'
      RATE_LIMITER_STORE: redis
      RATE_LIMITER_REDIS: redis://redis:6379
      RATE_LIMITER_POINTS: 50
      RATE_LIMITER_DURATION: 60

      EMAIL_TRANSPORT: smtp
      EMAIL_FROM: no-reply@ulink.com
      EMAIL_SMTP_HOST: ${MAIL_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${MAIL_PORT:-1025}
      EMAIL_SMTP_SECURE: ${MAIL_SECURE:-false}
      EMAIL_SMTP_USER: ${MAIL_USER:-}
      EMAIL_SMTP_PASSWORD: ${MAIL_PASSWORD:-}

      # Google OAuth 2.0 (SSO)
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
      AUTH_GOOGLE_DRIVER: ${AUTH_GOOGLE_DRIVER:-openid}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_ISSUER_URL: ${AUTH_GOOGLE_ISSUER_URL:-https://accounts.google.com/.well-known/openid-configuration}
      AUTH_GOOGLE_IDENTIFIER_KEY: ${AUTH_GOOGLE_IDENTIFIER_KEY:-email}
      AUTH_GOOGLE_ALLOW_PUBLIC_REGISTRATION: ${AUTH_GOOGLE_ALLOW_PUBLIC_REGISTRATION:-false}
      AUTH_GOOGLE_DEFAULT_ROLE_ID: ${AUTH_GOOGLE_DEFAULT_ROLE_ID:-e11b0e50-3030-410c-9999-000000000003}
      AUTH_GOOGLE_REDIRECT_ALLOW_LIST: ${AUTH_GOOGLE_REDIRECT_ALLOW_LIST:-http://localhost:3000/auth/callback}
    # Per-extension bind-mounts keep the baked-in `node_modules/` from the
    # custom image intact while letting src/ be edited on the host.
    volumes:
      - ./directus/uploads:/directus/uploads
      - ./directus/lib:/directus/lib
      - ./directus/extensions/otp-endpoint/src:/directus/extensions/otp-endpoint/src:ro
      - ./directus/extensions/password-change-endpoint/src:/directus/extensions/password-change-endpoint/src:ro
      - ./directus/extensions/password-reset-request-endpoint/src:/directus/extensions/password-reset-request-endpoint/src:ro
      - ./directus/extensions/customer-onboarding-endpoint/src:/directus/extensions/customer-onboarding-endpoint/src:ro
      - ./directus/extensions/customer-onboarding-hook:/directus/extensions/customer-onboarding-hook:ro
      - ./directus/extensions/password-policy-hook:/directus/extensions/password-policy-hook:ro
      - ./directus/extensions/security-headers-hook:/directus/extensions/security-headers-hook:ro
      - ./directus/extensions/media-policy-endpoint:/directus/extensions/media-policy-endpoint:ro
      - ./directus/extensions/media-policy-hook:/directus/extensions/media-policy-hook:ro
      - ./directus/extensions/commercial-import-endpoint:/directus/extensions/commercial-import-endpoint:ro
      - ./directus/extensions/docs-endpoint:/directus/extensions/docs-endpoint:ro
    ports:
      - '8055:8055'

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_started
    environment:
      SWAGGER_JSON: /app/openapi.json
    volumes:
      - ./openapi.json:/app/openapi.json:ro
    ports:
      - '8056:8080'

volumes:
  pgdata:
  redisdata:
