# ULink CI/CD — host deploy pipeline.
#
# Runs on a dedicated SHELL runner tagged `ulink-deploy` that executes directly on the
# host (gitlab.pathtech.net / 103.164.35.132), where /opt/ulink holds the persistent
# working tree and the git-ignored .env (real secrets live there, never in the repo).
#
# The job fetches the pushed commit using the short-lived CI_JOB_TOKEN (no long-lived
# token stored on disk), hard-resets /opt/ulink to it, rebuilds + recreates the stack
# with the production port overlay, then runs the idempotent bootstrap.
#
# Two manual jobs on `dev`:
#   - deploy:    Build + bootstrap (incremental, safe to run anytime)
#   - reset-db:  Wipe DB/uploads/cache → rebuild → bootstrap from scratch
# Press "play" on the desired job in the GitLab UI.

stages:
  - ops
  - deploy

variables:
  DEPLOY_DIR: '/opt/ulink'

# ── Reset Database (manual, dangerous) ────────────────────────────────────────
# Drops the DB, wipes uploads & Redis, restarts Directus, then runs bootstrap.
# Use when you need a completely fresh environment (schema changes, corrupted data, etc.).
reset-db:
  stage: ops
  tags:
    - ulink-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  environment:
    name: production
    url: http://103.164.35.132:8055
  script:
    - cd "$DEPLOY_DIR"
    - git fetch "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.pathtech.net/${CI_PROJECT_PATH}.git" "$CI_COMMIT_BRANCH"
    - git reset --hard FETCH_HEAD
    - git log -1 --oneline
    - export FRESH_SEED="true"
    - bash deploy/deploy.sh

# ── Deploy (manual, safe) ─────────────────────────────────────────────────────
# Incremental deploy: build containers, run idempotent bootstrap. No data loss.
deploy:
  stage: deploy
  tags:
    - ulink-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: false
  environment:
    name: production
    url: http://103.164.35.132:8055
  script:
    - cd "$DEPLOY_DIR"
    - git fetch "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.pathtech.net/${CI_PROJECT_PATH}.git" "$CI_COMMIT_BRANCH"
    - git reset --hard FETCH_HEAD
    - git log -1 --oneline
    - bash deploy/deploy.sh

