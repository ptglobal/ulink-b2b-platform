  <rect x="60" y="50" width="20" height="20" fill="#000"/>
  <rect x="90" y="60" width="10" height="20" fill="#000"/>
  <rect x="110" y="60" width="20" height="10" fill="#000"/>

  <rect x="60" y="80" width="10" height="30" fill="#000"/>
