  <!-- Random QR Data Patterns -->
  <rect x="60" y="10" width="10" height="10" fill="#000"/>
  <rect x="70" y="20" width="10" height="10" fill="#000"/>
  <rect x="60" y="30" width="20" height="10" fill="#000"/>

